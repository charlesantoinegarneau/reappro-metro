# Next.js on Netlify. The runtime is declared explicitly: this project was
# created before the app existed, so Netlify did not install it on its own
# (without it, no server function is deployed and every page is a 404).
# Netlify Database migrations (netlify/database/migrations) run before publishing.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
